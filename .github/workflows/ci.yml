name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --verbose

  build:
    name: build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: odquota-x86_64-windows.exe
            archive: odquota-x86_64-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: odquota-x86_64-linux
            archive: odquota-x86_64-linux.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: odquota-aarch64-linux
            archive: odquota-aarch64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: odquota-x86_64-macos
            archive: odquota-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: odquota-aarch64-macos
            archive: odquota-aarch64-macos.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/odquota" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C . "${{ matrix.artifact }}" README.md LICENSE
          sha256sum "dist/${{ matrix.archive }}" > "dist/${{ matrix.archive }}.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/odquota.exe" "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "${{ matrix.artifact }}", "README.md", "LICENSE" -DestinationPath "dist/${{ matrix.archive }}"
          $h = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.archive }}" | Out-File -Encoding ascii "dist/${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: false
          # The title must be the version alone, with no descriptive text.
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
